browser:
  cloud_provider: camofox
  camofox:
    user_id: hermes-browser-user
    session_key: browser-main
    adopt_existing_tab: true
    managed_persistence: false
toolsets:
  - hermes-cli
  - browser
command_allowlist:
  - chmod +x followed by immediate execution
  - copy/move file into sensitive credential/SSH/shell-rc path
  - copy/move file into system config path
  - execute_code
  - overwrite project env/config via redirection
  - overwrite system config
  - recursive delete
  - script execution via -e/-c flag
  - script execution via heredoc
  - shell command via -c/-lc flag
checkpoints:
  enabled: true
gateway:
  notifications:
    main_session_override: ''
