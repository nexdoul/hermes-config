display:
  language: zh
approvals:
  destructive_slash_confirm: false
  mode: smart
  smart_policy: 仅当命令递归删除或覆盖重要路径时才 ESCALATE：/、/etc、/home、/usr、/var、系统文件、用户的真实项目与数据目录。/tmp 下明确用于测试的 fixture 目录删除一律 APPROVE。常规开发命令（git、包管理、构建、测试、临时文件清理）一律 APPROVE。对于不存在的路径或无副作用的探测命令，一律 APPROVE。除此之外，不确定时按默认规则 ESCALATE，不要主动放低门槛。
security:
  protected_instruction_files: false
onboarding:
  seen:
    profile_build_offered: true
    busy_input_prompt: true
    tool_progress_prompt: true
