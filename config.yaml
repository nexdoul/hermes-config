agent:
  reasoning_effort: xhigh
  reasoning_overrides:
    dsh-mysub-oai-fast/gpt-6-luna: max
    dsh-mysub-oai/gpt-6.1-sol: xhigh
    dsh-mysub-oai-fast/gpt-6.1-sol: xhigh
    dsh-unisound/u2-med: high
  autonomy:
    mode: 'off'
    autonomy_wait_seconds: 300
    irreversible_ok: false
_config_version: 46
