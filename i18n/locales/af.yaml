    redirect: Redirecting the running turn{status_detail}.
    queue: Queued for the next turn{status_detail}.
    queue_subagent: Queued for the next turn{status_detail}. Your follow-up did not interrupt the subagents; /stop cancels everything.
    queue_compression: Queued for the next turn{status_detail}. The running turn is compacting, so this waits for it to finish.
  common:
    minutes_elapsed: '{minutes} min elapsed'
  provider_wait:
    lead_near: Almost there…
    watchdog_suffix: ' (still waiting on the provider)'
  onboarding:
    busy_interrupt: A busy agent is interrupted by a follow-up by default; /btw asks without interrupting.
    busy_queue: 💡 First-time tip — your message was queued for the next turn. This notice won't appear again.
    busy_steer: 💡 First-time tip — your message was added to the running turn. This notice won't appear again.
    busy_redirect: 💡 First-time tip — the running turn was redirected. This notice won't appear again.
cron:
  response_header: "Cronjob Response: {name}"
  job_id_line: "(job_id: {job_id})"
  manage_hint: "To stop or manage this job, send me a new message (e.g. \"stop reminder {name}\")."
  mirror_prefix: "[Cron delivery: {name}]"
  bot_chat_name: "Bot Chat ({profile})"
  undeliverable: "Hermes could not deliver this result to Bot Chat: the `hermes` command was not found. The result is saved; run `hermes cron runs` to see it, or `hermes doctor` if this keeps happening"
  undeliverable_profile: "Hermes could not deliver this result to Bot Chat (profile '{profile}'). The result is saved; run `hermes cron runs` to see it, or `hermes doctor` if this keeps happening"

