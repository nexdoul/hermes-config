tips:
  tip_000: "/bg <prompt> 会在单独的会话里跑任务，当前会话不受影响；/btw <问题> 可就当前对话补充提问而不打断它。"
  tip_001: "/branch 会从当前会话分叉，可以在不丢失已有进度的前提下探索另一个方向。"
  tip_002: "/compress 可在对话变长时手动压缩上下文。"
  tip_003: "/rollback 列出文件系统检查点——把文件恢复到某个检查点时的状态。"
  tip_004: "/rollback diff 2 预览自检查点 2 以来改动了什么，不真正恢复。"
  tip_005: "/rollback 2 src/file.py 只把单个文件恢复到指定检查点的状态。"
  tip_006: "/title \"my project\" 给会话命名——之后用 /resume 或 hermes -c 找回它。"
  tip_007: "/resume 接着你上次离开的位置继续之前命名过的会话。"
  tip_008: "/queue <prompt> 会把消息排入下一轮，不会打断当前这一轮。"
  tip_009: "/undo 从对话中移除最后一轮用户/助手往来。"
  tip_010: "/retry 重发你上一条消息——模型回答不太对劲时很有用。"
  tip_011: "/verbose 切换工具进度显示：off → new → all → verbose。"
  tip_012: "/reasoning high 提高模型的思考深度。/reasoning show 会显示推理过程。"
  tip_013: "/fast 切换优先处理以获得更快的 API 响应（取决于 provider）。"
  tip_014: "/yolo 在本次会话剩余时间内跳过所有危险命令的审批提示。"
  tip_015: "/model 让你在会话中途切换模型——试试 /model sonnet 或 /model gpt-5。"
  tip_016: "/model --global 永久修改你的默认模型。"
  tip_017: "/personality pirate 会设置一个有趣的人格——内置 14 种，从 kawaii 到 shakespeare。"
  tip_018: "/skin 切换 CLI 主题——试试 ares、mono、slate、poseidon 或 charizard。"
  tip_019: "/statusbar 切换常驻状态栏，显示模型、token、上下文占用百分比、费用和时长。"
  tip_020: "/tools disable browser 会在当前会话中临时移除浏览器工具。"
  tip_021: "/browser connect 通过 CDP 把浏览器工具挂到你正在运行的 Chromium 系浏览器上。"
  tip_022: "/plugins 列出已安装的插件及其状态。"
  tip_023: "/cron 管理定时任务——可设置带任意平台投递的循环提示。"
  tip_024: "/reload-mcp 在不重启的情况下热重载 MCP 服务器配置。"
  tip_025: "/usage 显示 token 用量、费用明细和会话时长。"
  tip_026: "/insights 显示最近 30 天的使用分析。"
  tip_027: "/paste 检查剪贴板里是否有图片，并把它附到下一条消息上。"
  tip_028: "/profile 显示当前生效的 profile 及其主目录。"
  tip_029: "/config 一览当前配置。"
  tip_030: "/stop 杀掉 agent 派生的所有后台进程。"
  tip_031: "@file:path/to/file.py 会把文件内容直接注入你的消息。"
  tip_032: "@file:main.py:10-50 只注入一个文件的第 10-50 行。"
  tip_033: "@folder:src/ 注入一个目录树列表。"
  tip_034: "@diff 把你未暂存的 git 改动注入消息。"
  tip_035: "@staged 注入你已暂存的 git 改动（git diff --staged）。"
  tip_036: "@git:5 注入最近 5 次提交及其完整补丁。"
  tip_037: "@url:https://example.com 抓取并把网页内容注入。"
  tip_038: "输入 @ 会触发文件路径补全——可以交互式定位到任意文件。"
  tip_039: "可以组合多个引用：\"看看 @file:main.py 和 @file:test.py 是否一致。\""
  tip_040: "Alt+Enter 插入换行以输入多行内容。（Windows Terminal 会截获 Alt+Enter——请改用 Ctrl+Enter。）"
  tip_041: "Ctrl+C 打断 agent。2 秒内再按一次则强制退出。"
  tip_042: "Ctrl+Z 把 Hermes 挂到后台——在 shell 里运行 fg 恢复。"
  tip_043: "Tab 接受自动补全的幽灵文本，或补全斜杠命令。"
  tip_044: "在 agent 工作期间输入新消息即可打断它并改方向。"
  tip_045: "Alt+V 把剪贴板里的图片粘贴进对话。"
  tip_046: "粘贴 5 行以上会自动存成文件，并插入一个简短引用而不是整段内容。"
  tip_047: "hermes -c 恢复你最近一次 CLI 会话。hermes -c \"project name\" 按标题恢复。"
  tip_048: "hermes -w 创建一个隔离的 git worktree——适合并行跑多个 agent。"
  tip_049: "hermes -w -q \"Fix issue #42\" 把 worktree 隔离和一次性提问结合起来。"
  tip_050: "hermes chat -t web,terminal 只启用指定工具集，让会话更专注。"
  tip_051: "hermes chat -s github-pr-workflow 在启动时预载一个 skill。"
  tip_052: "hermes chat -q \"query\" 运行一次非交互提问然后退出。"
  tip_053: "hermes chat --max-turns 1000 覆盖每轮默认 500 次迭代的上限。"
