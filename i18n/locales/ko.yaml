    redirect: Redirecting the running turn{status_detail}.
    queue: Queued for the next turn{status_detail}.
    queue_subagent: Queued for the next turn{status_detail}. Your follow-up did not interrupt the subagents; /stop cancels everything.
    queue_compression: Queued for the next turn{status_detail}. The running turn is compacting, so this waits for it to finish.
