tips:
  tip_000: /bg <prompt> runs a task in a separate session while your current one stays free; /btw <question> answers a side question about this conversation without interrupting it.
  tip_001: /branch forks the current session so you can explore a different direction without losing progress.
  tip_002: /compress manually compresses conversation context when things get long.
  tip_003: /rollback lists filesystem checkpoints — restore files the agent modified to any prior state.
  tip_004: /rollback diff 2 previews what changed since checkpoint 2 without restoring anything.
  tip_005: /rollback 2 src/file.py restores a single file from a specific checkpoint.
  tip_006: /title "my project" names your session — resume it later with /resume or hermes -c.
  tip_007: /resume picks up where you left off in a previously named session.
  tip_008: /queue <prompt> queues a message for the next turn without interrupting the current one.
  tip_009: /undo removes the last user/assistant exchange from the conversation.
  tip_010: /retry resends your last message — useful when the agent's response wasn't quite right.
  tip_011: '/verbose cycles tool progress display: off → new → all → verbose.'
  tip_012: /reasoning high increases the model's thinking depth. /reasoning show displays the reasoning.
  tip_013: /fast toggles priority processing for faster API responses (provider-dependent).
  tip_014: /yolo skips all dangerous command approval prompts for the rest of the session.
  tip_015: /model lets you switch models mid-session — try /model sonnet or /model gpt-5.
  tip_016: /model --global changes your default model permanently.
  tip_017: /personality pirate sets a fun personality — 14 built-in options from kawaii to shakespeare.
  tip_018: /skin changes the CLI theme — try ares, mono, slate, poseidon, or charizard.
  tip_019: /statusbar toggles a persistent bar showing model, tokens, context fill %, cost, and duration.
  tip_020: /tools disable browser temporarily removes browser tools for the current session.
  tip_021: /browser connect attaches browser tools to your running Chromium-family browser via CDP.
  tip_022: /plugins lists installed plugins and their status.
  tip_023: /cron manages scheduled tasks — set up recurring prompts with delivery to any platform.
  tip_024: /reload-mcp hot-reloads MCP server configuration without restarting.
  tip_025: /usage shows token usage, cost breakdown, and session duration.
  tip_026: /insights shows usage analytics for the last 30 days.
