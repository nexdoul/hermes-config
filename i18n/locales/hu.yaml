  tip_325: Checkpoints skip directories with more than 50,000 files to avoid slow git operations on massive monorepos.
  tip_326: 'tts.provider: piper runs 44-language local TTS on CPU — voices auto-download to ~/.hermes/cache/piper-voices/.'
  tip_327: 'tts.providers.<name>.type: command wires any CLI TTS engine with {input_path} and {output_path} placeholders.'
  tip_328: API_SERVER_ENABLED=true runs an OpenAI-compatible endpoint alongside the gateway for Open WebUI and LibreChat.
  tip_329: 'GATEWAY_PROXY_URL runs a split setup: platform I/O locally, agent work delegated to a remote API server.'
  tip_330: MATRIX_DEVICE_ID pins a stable device ID for E2EE — without it, keys rotate every start and historic decrypt breaks.
  tip_331: TELEGRAM_WEBHOOK_SECRET is required whenever TELEGRAM_WEBHOOK_URL is set — generate with openssl rand -hex 32.
  tip_332: batch_runner.py --resume content-matches completed prompts by text so dataset reorders don't re-run finished work.
  tip_333: /new starts a fresh session in place (alias /reset) — fresh session ID, clean history, CLI stays open.
  tip_334: /clear wipes the terminal screen AND starts a new session — one shortcut for a visual reset.
  tip_335: /history prints the current conversation in-line without leaving the CLI — useful for a quick re-read.
  tip_336: /save writes the current conversation to disk without ending the session.
  tip_337: '/status shows session info at a glance: ID, title, model, token usage, and elapsed time.'
  tip_338: /image <path> attaches a local image file for your next prompt without pasting or drag-and-drop.
  tip_339: /platforms shows gateway and messaging-platform connection status right from inside chat.
  tip_340: /commands paginates the full slash-command + installed-skill list — useful on platforms without tab completion.
  tip_341: /toolsets lists every available toolset so you know what -t/--toolsets accepts.
  tip_342: /voice tts toggles TTS-only mode — agent replies out loud but you still type your prompts.
  tip_343: /reload-skills re-scans ~/.hermes/skills/ so drop-in skills appear without restarting the session.
  tip_344: /indicator kaomoji|emoji|unicode|ascii picks the TUI busy-indicator style shown during agent runs.
  tip_345: /debug uploads a support bundle (system info + logs) and returns shareable links — works in chat too.
  tip_346: 'hermes -z "<prompt>" is the purest one-shot: final answer on stdout, nothing else — ideal for piping in scripts.'
  tip_347: hermes chat --pass-session-id injects the session ID into the system prompt so the agent can self-reference it.
  tip_348: hermes chat --image path/to/pic.png attaches a local image to a single -q query without a separate upload step.
  tip_349: hermes chat --ignore-user-config skips the active user config — reproducible bug reports and CI runs.
  tip_350: hermes chat --source tool tags programmatic chats so they don't clutter hermes sessions list.
  tip_351: hermes dump --show-keys includes redacted API key fingerprints for deeper support debugging.
  tip_352: hermes sessions rename <ID> "new title" renames any past session; hermes sessions delete <ID> removes one.
  tip_353: hermes import restores a full Hermes backup zip; session JSON/JSONL exports import from the dashboard Sessions page.
  tip_354: hermes fallback manages the fallback_model chain interactively — no hand-editing config.yaml.
  tip_355: hermes pairing rotates the DM pairing token — the first messager after rotation claims access to the bot.
  tip_356: hermes setup walks first-time users through provider, keys, and platform wiring in one interactive flow.
  tip_357: hermes status --deep runs the full health sweep across every component; plain hermes status is the quick view.
  tip_358: HERMES_AGENT_TIMEOUT=0 disables the gateway inactivity kill for a running agent — use for long research runs.
  tip_359: HERMES_ENABLE_PROJECT_PLUGINS=1 auto-loads repo-local plugins from ./.hermes/plugins/ — trust-gated by design.
  tip_360: HERMES_DISABLE_FILE_STATE_GUARD=1 turns off the 'file changed since you read it' guard on patch and write_file.
  tip_361: HERMES_ALLOW_PRIVATE_URLS=true lets web tools hit localhost and private networks — off by default in gateway mode.
  tip_362: HERMES_OPTIONAL_SKILLS=name1,name2 auto-installs extra optional-catalog skills on first run per profile.
  tip_363: HERMES_BUNDLED_SKILLS points at a custom bundled-skill tree — used by Homebrew and Nix packaging.
  tip_364: HERMES_DUMP_REQUEST_STDOUT=1 dumps every API request payload to stdout instead of log files.
  tip_365: HERMES_OAUTH_TRACE=1 logs redacted OAuth token exchange and refresh attempts for debugging provider auth.
  tip_366: HERMES_STREAM_RETRIES (default 3) controls mid-stream reconnect attempts on transient network errors.
  tip_367: HERMES_GATEWAY_BUSY_ACK_ENABLED=false silences the ⚡/⏳/⏩ ack messages when a user messages a busy agent.
  tip_368: HERMES_AGENT_NOTIFY_INTERVAL (default 180s) sets how often the gateway pings with progress on long turns.
  tip_369: HERMES_RESTART_DRAIN_TIMEOUT (default 900s) caps how long /restart waits for in-flight runs before forcing.
  tip_370: HERMES_CHECKPOINT_TIMEOUT (default 30s) caps filesystem checkpoint creation — raise it on huge monorepos.
  tip_371: 'image_gen.model in config.yaml picks the FAL model: flux-2/klein, gpt-image-2, nano-banana-pro, and more.'
  tip_372: image_gen.provider routes image generation through a plugin (OpenAI Images, Codex, FAL) instead of the default.
  tip_373: AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY point vision analysis at any OpenAI-compatible endpoint.
  tip_374: 'security.tirith_fail_open: false makes Hermes block commands when the tirith scanner itself errors out.'
  tip_375: TIRITH_FAIL_OPEN env var overrides the tirith_fail_open config — a quick toggle without editing config.yaml.
  tip_376: --source tool chats are excluded from hermes sessions list by default — set --source explicitly to see them.
  tip_377: Session IDs are timestamp-prefixed (20250305_091523_abcd) so sorting works naturally in ls and jq.
  tip_378: API_SERVER_MODEL_NAME customizes the model name on /v1/models — essential for multi-profile Open WebUI setups.
  tip_379: Dashboard plugins are served from /dashboard-plugins/<name>/ — drop files into ~/.hermes/dashboard-plugins/.
