    created: "created"
    patched: "patched"
    rewritten: "rewritten"
    written: "written"
    removed: "removed"
    deleted: "deleted"
  skill_action_line: "Skill '{name}' {verb}{path}"
  memory_action_line: "{label} updated"
  verbose_patch_line: "📝 Skill '{name}' patched: \"{old}\" → \"{new}\""
  verbose_create_line: "📝 Skill '{name}' {verb}: {description}"
