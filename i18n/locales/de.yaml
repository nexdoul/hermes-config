tips:
  tip_000: /bg <prompt> runs a task in a separate session while your current one stays free; /btw <question> answers a side question about this conversation without interrupting it.
  tip_001: /branch forks the current session so you can explore a different direction without losing progress.
  tip_002: /compress manually compresses conversation context when things get long.
  tip_003: /rollback lists filesystem checkpoints — restore files the agent modified to any prior state.
  tip_004: /rollback diff 2 previews what changed since checkpoint 2 without restoring anything.
  tip_005: /rollback 2 src/file.py restores a single file from a specific checkpoint.
  tip_006: /title "my project" names your session — resume it later with /resume or hermes -c.
  tip_007: /resume picks up where you left off in a previously named session.
  tip_008: /queue <prompt> queues a message for the next turn without interrupting the current one.
  tip_009: /undo removes the last user/assistant exchange from the conversation.
  tip_010: /retry resends your last message — useful when the agent's response wasn't quite right.
  tip_011: '/verbose cycles tool progress display: off → new → all → verbose.'
  tip_012: /reasoning high increases the model's thinking depth. /reasoning show displays the reasoning.
  tip_013: /fast toggles priority processing for faster API responses (provider-dependent).
  tip_014: /yolo skips all dangerous command approval prompts for the rest of the session.
  tip_015: /model lets you switch models mid-session — try /model sonnet or /model gpt-5.
  tip_016: /model --global changes your default model permanently.
  tip_017: /personality pirate sets a fun personality — 14 built-in options from kawaii to shakespeare.
  tip_018: /skin changes the CLI theme — try ares, mono, slate, poseidon, or charizard.
  tip_019: /statusbar toggles a persistent bar showing model, tokens, context fill %, cost, and duration.
  tip_020: /tools disable browser temporarily removes browser tools for the current session.
  tip_021: /browser connect attaches browser tools to your running Chromium-family browser via CDP.
  tip_022: /plugins lists installed plugins and their status.
  tip_023: /cron manages scheduled tasks — set up recurring prompts with delivery to any platform.
  tip_024: /reload-mcp hot-reloads MCP server configuration without restarting.
  tip_025: /usage shows token usage, cost breakdown, and session duration.
  tip_026: /insights shows usage analytics for the last 30 days.
  tip_027: /paste checks your clipboard for an image and attaches it to your next message.
  tip_028: /profile shows which profile is active and its home directory.
  tip_029: /config shows your current configuration at a glance.
  tip_030: /stop kills all running background processes spawned by the agent.
  tip_031: '@file:path/to/file.py injects file contents directly into your message.'
  tip_032: '@file:main.py:10-50 injects only lines 10-50 of a file.'
  tip_033: '@folder:src/ injects a directory tree listing.'
  tip_034: '@diff injects your unstaged git changes into the message.'
  tip_035: '@staged injects your staged git changes (git diff --staged).'
  tip_036: '@git:5 injects the last 5 commits with full patches.'
  tip_037: '@url:https://example.com fetches and injects a web page''s content.'
  tip_038: Typing @ triggers filesystem path completion — navigate to any file interactively.
  tip_039: 'Combine multiple references: "Review @file:main.py and @file:test.py for consistency."'
  tip_040: Alt+Enter inserts a newline for multi-line input. (Windows Terminal intercepts Alt+Enter — use Ctrl+Enter instead.)
  tip_041: Ctrl+C interrupts the agent. Double-press within 2 seconds to force exit.
  tip_042: Ctrl+Z suspends Hermes to the background — run fg in your shell to resume.
  tip_043: Tab accepts auto-suggestion ghost text or autocompletes slash commands.
  tip_044: Type a new message while the agent is working to interrupt and redirect it.
  tip_045: Alt+V pastes an image from your clipboard into the conversation.
  tip_046: Pasting 5+ lines auto-saves to a file and inserts a compact reference instead.
  tip_047: hermes -c resumes your most recent CLI session. hermes -c "project name" resumes by title.
  tip_048: hermes -w creates an isolated git worktree — perfect for parallel agent workflows.
  tip_049: 'hermes -w -q "Fix issue #42" combines worktree isolation with a one-shot query.'
  tip_050: hermes chat -t web,terminal enables only specific toolsets for a focused session.
  tip_051: hermes chat -s github-pr-workflow preloads a skill at launch.
  tip_052: hermes chat -q "query" runs a single non-interactive query and exits.
  tip_053: hermes chat --max-turns 1000 overrides the default 500-iteration limit per turn.
  tip_054: hermes chat --checkpoints enables filesystem snapshots before every destructive file change.
  tip_055: hermes --yolo bypasses all dangerous command approval prompts for the entire session.
  tip_056: hermes chat --source telegram tags the session for filtering in hermes sessions list.
  tip_057: hermes -p work chat runs under a specific profile without changing your default.
  tip_058: hermes doctor --fix diagnoses and auto-repairs config and dependency issues.
  tip_059: hermes dump outputs a compact setup summary — great for bug reports.
  tip_060: hermes config set KEY VALUE auto-routes secrets to .env and everything else to config.yaml.
  tip_061: hermes config edit opens config.yaml in your default editor.
  tip_062: hermes config check scans for missing or stale configuration options.
  tip_063: hermes sessions browse opens an interactive session picker with search.
  tip_064: hermes sessions stats shows session counts by platform and database size.
  tip_065: hermes sessions prune --older-than 30 cleans up old sessions.
  tip_066: hermes skills search react --source skills-sh searches the skills.sh public directory.
  tip_067: hermes skills check scans installed hub skills for upstream updates.
  tip_068: hermes skills tap add myorg/skills-repo adds a custom GitHub skill source.
  tip_069: hermes skills snapshot export setup.json exports your skill configuration for backup or sharing.
  tip_070: hermes mcp add github --command npx adds MCP servers from the command line.
  tip_071: hermes mcp serve runs Hermes itself as an MCP server for other agents.
  tip_072: hermes auth add lets you add multiple API keys for credential pool rotation.
  tip_073: hermes completion bash >> ~/.bashrc enables tab completion for all commands and profiles.
  tip_074: hermes logs -f follows agent.log in real time. --level WARNING --since 1h filters output.
  tip_075: hermes backup creates a zip backup of your entire Hermes home directory.
  tip_076: hermes profile create coder creates an isolated profile that becomes its own command.
  tip_077: hermes profile create work --clone copies your current config and keys to a new profile.
  tip_078: hermes update syncs new bundled skills to ALL profiles automatically.
  tip_079: hermes gateway install sets up Hermes as a system service (systemd/launchd).
  tip_080: hermes memory setup lets you configure an external memory provider (Honcho, Mem0, etc.).
  tip_081: hermes webhook subscribe creates event-driven webhook routes with HMAC validation.
  tip_082: 'Save money: hermes tools disables unused tools, hermes skills config trims skills down.'
  tip_083: /reasoning low or /reasoning minimal cuts thinking depth below the default (medium) — faster, cheaper responses.
  tip_084: hermes models routes vision, compression, and aux tasks to cheaper models — cuts background token cost 85%+ without downgrading your main chat model.
  tip_085: 'Set display.bell_on_complete: true in config.yaml to hear a bell when long tasks finish.'
  tip_086: 'Set display.streaming: true to see tokens appear in real time as the model generates.'
  tip_087: 'Set display.show_reasoning: true to watch the model''s chain-of-thought reasoning.'
  tip_088: 'Set display.compact: true to reduce whitespace in output for denser information.'
  tip_089: 'Set display.busy_input_mode: queue to queue messages instead of interrupting the agent, or steer to inject them mid-run via /steer.'
  tip_090: 'Set display.resume_display: minimal to skip the full conversation recap on session resume.'
  tip_091: 'Set compression.threshold: 0.50 to control when auto-compression fires (default: 50% of context).'
  tip_092: 'Set agent.max_turns: 1000 to let the agent take more tool-calling steps per turn.'
  tip_093: 'Set file_read_max_chars: 200000 to increase the max content per read_file call.'
  tip_094: 'Set approvals.mode: smart to let an LLM auto-approve safe commands and auto-deny dangerous ones.'
  tip_095: Set fallback_model in config.yaml to automatically fail over to a backup provider.
  tip_096: 'Set privacy.redact_pii: true to hash user IDs and phone numbers before sending to the LLM.'
  tip_097: 'Set browser.record_sessions: true to auto-record browser sessions as WebM videos.'
  tip_098: 'Set worktree: true in config.yaml to always create a git worktree (same as hermes -w).'
  tip_099: 'Set security.website_blocklist.enabled: true to block specific domains from web tools.'
  tip_100: 'Set cron.wrap_response: false to deliver raw agent output without the cron header/footer.'
  tip_101: HERMES_TIMEZONE overrides the server timezone with any IANA timezone string.
  tip_102: 'Environment variable substitution works in config.yaml: use ${VAR_NAME} syntax.'
  tip_103: Quick commands in config.yaml run shell commands instantly with zero token usage.
  tip_104: Custom personalities can be defined in config.yaml under agent.personalities.
  tip_105: provider_routing controls OpenRouter provider sorting, whitelisting, and blacklisting.
  tip_106: execute_code runs Python scripts that call Hermes tools programmatically — results stay out of context.
  tip_107: delegate_task spawns up to 10 concurrent sub-agents by default (delegation.max_concurrent_children) with isolated contexts for parallel work.
  tip_108: web_extract works on PDF URLs — pass any PDF link and it converts to markdown.
  tip_109: search_files is ripgrep-backed and faster than grep — use it instead of terminal grep.
  tip_110: patch uses 9 fuzzy matching strategies so minor whitespace differences won't break edits.
  tip_111: patch supports V4A format for bulk multi-file edits in a single call.
  tip_112: read_file suggests similar filenames when a file isn't found.
  tip_113: read_file auto-deduplicates — re-reading an unchanged file returns a lightweight stub.
  tip_114: browser_vision takes a screenshot and analyzes it with AI — works for CAPTCHAs and visual content.
  tip_115: browser_console can evaluate JavaScript expressions in the page context.
  tip_116: image_generate creates images with FLUX 2 Pro and automatic 2x upscaling.
  tip_117: text_to_speech converts text to audio — plays as voice bubbles on Telegram.
  tip_118: send_message can reach any connected messaging platform from within a session.
  tip_119: The todo tool helps the agent track complex multi-step tasks during a session.
  tip_120: session_search performs full-text search across ALL past conversations.
  tip_121: The agent automatically saves preferences, corrections, and environment facts to memory.
  tip_122: /moa routes one hard prompt through your configured Mixture of Agents model set.
  tip_123: Terminal commands support background mode with notify_on_complete for long-running tasks.
  tip_124: Terminal background processes support watch_patterns to alert on specific output lines.
  tip_125: 'The terminal tool supports 6 backends: local, Docker, SSH, Modal, Daytona, and Singularity.'
  tip_126: Each profile gets its own config, API keys, memory, sessions, skills, and cron jobs.
  tip_127: Profile names become shell commands — 'hermes profile create coder' creates the 'coder' command.
  tip_128: hermes profile export coder -o backup.tar.gz creates a portable profile archive.
  tip_129: If two profiles accidentally share a bot token, the second gateway is blocked with a clear error.
